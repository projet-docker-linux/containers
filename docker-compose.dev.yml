services:
  nginx:
    image: nginx:latest
    container_name: dev-nginx-container
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
      - ./nginx/default.dev.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: always

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev-php-container
    volumes:
      - ./www:/var/www/html
    depends_on:
      - db
    restart: always
    env_file: ".env"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

  db:
    image: mariadb:11
    container_name: dev-db-container
    restart: always
    env_file: ".env"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./www/sql/import.sql:/docker-entrypoint-initdb.d/import.sql
    ports:
      - "3306:3306"

volumes:
  db_data:
