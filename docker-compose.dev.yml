services:
  nginx:
    image: nginx:latest
    container_name: nginx-container
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: always

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php-container
    volumes:
      - ./www:/var/www/html
    depends_on:
      - db
    restart: always

  db:
    image: mariadb:11
    container_name: db-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: videgrenier
      MYSQL_USER: vguser
      MYSQL_PASSWORD: vgpassword
    volumes:
      - db_data:/var/lib/mysql
      - ./www/sql/import.sql:/docker-entrypoint-initdb.d/import.sql
    ports:
      - "3306:3306"

volumes:
  db_data:
