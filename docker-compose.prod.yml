services:
  nginx:
    image: nginx:latest
    container_name: prod-nginx-container
    ports:
      - "8082:80"
    volumes:
      - ./php_code:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - prod_net

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prod-php-container
    ports:
      - "9092:80"
    volumes:
      - ./php_code:/var/www/html
    depends_on:
      - db
    networks:
      - prod_net
  db:
    image: mariadb:11
    container_name: prod-db-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: videgrenier
      MYSQL_USER: vguser
      MYSQL_PASSWORD: vgpassword
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "33062:3306"
    networks: 
      - prod_net

volumes:
  db_data:

networks:
  prod_net:
    name: prod_net
    driver: bridge
