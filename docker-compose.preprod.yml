services:
  nginx:
    image: nginx:latest
    container_name: preprod-nginx-container
    ports:
      - "8081:80"  # Preprod web on localhost:8081
    volumes:
      - ./www:/var/www/html  # Use same source code
      - ./nginx/default.preprod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    restart: always

  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: preprod-php-container
    volumes:
      - ./www:/var/www/html
    depends_on:
      - db
    restart: always

  db:
    image: mariadb:11
    container_name: preprod-db-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: videgrenier
      MYSQL_USER: vguser
      MYSQL_PASSWORD: vgpassword
    volumes:
      - preprod_db_data:/var/lib/mysql
      - ./www/sql/import.sql:/docker-entrypoint-initdb.d/import.sql
    ports:
      - "33061:3306"  # Avoid conflict with dev DB

volumes:
  preprod_db_data:
